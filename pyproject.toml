[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "epl-forecast"
version = "1.0.0"
description = "Premier League forecasting platform: data pipeline, statistical models, walk-forward evaluation, Monte Carlo season simulation and a REST API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.31",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
epl = "epl.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
    "psutil>=6",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-requests>=2.31",
]

[tool.hatch.build.targets.wheel]
packages = ["src/epl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Emitted inside scikit-learn's own boosting code with joblib 1.6; not actionable here.
    "ignore:`sklearn.utils.parallel.delayed` should be used:UserWarning",
]
markers = [
    "postgres: integration tests that need a running PostgreSQL (EPL_TEST_DATABASE_URL)",
    "slow: tests that fit models on real data",
]

[tool.coverage.run]
source = ["epl"]
omit = ["src/epl/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["src/epl/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "NPY", "PD002"]
ignore = [
    "PLR0913",  # many arguments: model/estimator signatures
    "PLR2004",  # magic values: football has many fixed numbers (3 points, 38 matchweeks)
    "N803",     # argument name should be lowercase: X for feature matrices (sklearn convention)
    "N806",     # variable in function should be lowercase: X, P matrices
    "RUF001",   # ambiguous unicode: maths notation (λ, ρ, σ) in strings is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses are immutable, so they are safe as default arguments.
extend-immutable-calls = ["epl.features.elo.EloParams", "epl.features.EloParams"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]
# The CLI imports heavy modules inside commands so `epl --help` stays instant.
"src/epl/cli.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/epl", "scripts"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["src/epl/migrations/"]
