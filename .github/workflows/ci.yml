name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: epl
          POSTGRES_PASSWORD: epl
          POSTGRES_DB: epl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U epl" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      EPL_TEST_DATABASE_URL: postgresql+psycopg://epl:epl@localhost:5432/epl_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: No restricted data in Git or the Docker build context
        run: uv run python scripts/check_distribution.py --docker
      - name: Lint
        run: uv run ruff check src tests scripts && uv run ruff format --check src tests scripts
      - name: Type-check
        run: uv run mypy
      - name: Migrations match the ORM models
        run: EPL_DATABASE_URL=sqlite:///./ci.db uv run epl db upgrade && EPL_DATABASE_URL=sqlite:///./ci.db uv run epl db check
      - name: Tests (incl. PostgreSQL integration)
        run: uv run pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=90
      - name: OpenAPI contract is committed
        run: uv run epl openapi --out /tmp/openapi.json && diff -u docs/openapi.json /tmp/openapi.json

  frontend:
    name: Frontend · types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types match the OpenAPI contract
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: epl-forecast:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image contains only redistributable data
        run: |
          docker run --rm --entrypoint sh epl-forecast:ci -c             'test ! -e /app/data/premier-league && test ! -e /app/data/artifacts/premier-league && ls /app/data'
      - name: Smoke test
        run: |
          docker run -d --name epl -p 8000:8000 epl-forecast:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/v1/ready && break; sleep 2; done
          curl -fsS localhost:8000/api/v1/predictions/upcoming?limit=1
          curl -fsS localhost:8000/api/v1/meta | grep -q '"synthetic":true'
          curl -fsS localhost:8000/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8000/api/v1/seasons/2026/simulation?runs=50000')" = 422
